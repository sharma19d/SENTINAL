name: Homora (Android)

on:
  push:
    paths: ["homora/**", ".github/workflows/homora.yml"]
  pull_request:
    paths: ["homora/**", ".github/workflows/homora.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: homora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The Firebase config is a repository secret (Settings > Secrets > Actions >
      # GOOGLE_SERVICES_JSON, the file's contents). Without it the build still
      # succeeds, with analytics and feedback disabled.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Unit tests, debug and release builds
        run: ./gradlew --no-daemon testDebugUnitTest -Psnapshots assembleDebug assembleRelease
      # Install this one to try the app: it's minified and precompiled, so it starts
      # far faster than the debug build. (Signed with the debug key; see app/build.gradle.kts.)
      - uses: actions/upload-artifact@v4
        with:
          name: homora-release-apk
          path: homora/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: homora-debug-apk
          path: homora/app/build/outputs/apk/debug/*.apk
      # Screenshots of the real screens (SnapshotTest), for reviewing the UI without a phone.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homora-screenshots
          path: homora/app/snapshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homora-test-reports
          path: homora/app/build/reports/tests/
