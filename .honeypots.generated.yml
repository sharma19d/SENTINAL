services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: sentinel-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - /home/charon/Desktop/SENTINAL/deception/cowrie/cowrie.cfg:/home/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - /home/charon/Desktop/SENTINAL/deception/cowrie/log:/home/cowrie/cowrie-git/var/log/cowrie
    environment:
      - TZ=UTC

  opencanary:
    image: thinkst/opencanary:latest
    container_name: sentinel-opencanary
    restart: unless-stopped
    ports:
      - "8080:80"
      - "2121:21"
      - "4445:445"
      - "33306:3306"
    volumes:
      - /home/charon/Desktop/SENTINAL/deception/opencanary/opencanary.conf:/root/.opencanary.conf:ro
      - /home/charon/Desktop/SENTINAL/deception/opencanary:/var/log
    environment:
      - TZ=UTC
