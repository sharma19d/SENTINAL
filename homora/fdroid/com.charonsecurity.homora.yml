Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: bfeb18f54ecbc4b2ef3ab2dd8582273a0f409da0
    subdir: homora/app
    gradle:
      - foss
    prebuild:
      - sed -i -e '/libs\.firebase/d' -e '/libs\.plugins\.firebase/d' -e '/libs\.plugins\.google\.services/d'
        -e '/libs\.kotlinx\.coroutines\.play\.services/d' -e '/com\.google\.gms/d'
        -e '/com\.google\.firebase/d' build.gradle.kts ../build.gradle.kts
      - sed -i -e '/^firebase/d' -e '/^crashlytics/d' -e '/^googleServices/d' -e '/^google-services/d'
        -e '/play-services/d' ../gradle/libs.versions.toml

AutoUpdateMode: Version
UpdateCheckMode: Tags
